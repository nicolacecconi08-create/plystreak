<!doctype html><html lang="it" data-board="amethyst" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="overhaul.css"><style>main{width:100%;max-width:650px}.board-wrap{margin-top:24px}</style><main><button id="empty">Vuota</button><button id="full">Completa</button><button id="flip">Ruota</button><div class="board-wrap"><div style="width:15px;flex-shrink:0;background:#ccc"></div><div class="board" id="board"></div></div><output id="result"></output></main><script type="module">
import {Chess} from './vendor/chess.js';import {drawBoard} from './mini-board.js';
let c=new Chess(),flipped=false;const b=document.querySelector('#board');function render(){drawBoard(b,c,{flipped});requestAnimationFrame(()=>{const r=b.getBoundingClientRect(),cells=[...b.querySelectorAll('.square')].map(e=>e.getBoundingClientRect());const ok=cells.length===64&&Math.abs(r.width-r.height)<.1&&cells.every((s,i)=>Math.abs(s.width-s.height)<.1&&Math.abs(s.x-(r.x+(i%8)*r.width/8))<.1&&Math.abs(s.y-(r.y+Math.floor(i/8)*r.height/8))<.1);document.querySelector('#result').textContent=(ok?'PASS':'FAIL')+' 64 caselle quadrate, nessuna banda — '+r.width+' × '+r.height})}
document.querySelector('#empty').onclick=()=>{c=new Chess();c.clear();render()};document.querySelector('#full').onclick=()=>{c=new Chess();render()};document.querySelector('#flip').onclick=()=>{flipped=!flipped;render()};render();
</script></html>
