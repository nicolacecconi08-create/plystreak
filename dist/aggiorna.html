<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiorna Plystreak</title><style>body{margin:0;background:#1b101b;color:#f4e8d6;font:18px system-ui}main{max-width:36rem;margin:10vh auto;padding:1.5rem}button,a{font:inherit}button{background:#e9a173;color:#1b101b;border:0;border-radius:.6rem;padding:.9rem 1.2rem;font-weight:700}a{color:#ffc4a2}</style></head><body><main><h1>Aggiorna Plystreak</h1><p>Salva prima eventuali partite o analisi aperte. L’aggiornamento può richiedere qualche minuto.</p><button id="update">Aggiorna ora</button><p id="status" role="status"></p><p><a href="./">Apri Plystreak</a></p></main><script>
const button=document.getElementById('update'),status=document.getElementById('status');
button.onclick=async()=>{
  button.disabled=true;status.textContent='Ricerca dell’aggiornamento…';
  try{
    if(!('serviceWorker' in navigator)) throw Error('Il browser non supporta gli aggiornamenti offline.');
    const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    await registration.update();
    let worker=registration.installing;
    if(worker){
      status.textContent='Download in corso. Mantieni aperta questa pagina e la connessione attiva.';
      await new Promise((resolve,reject)=>{const check=()=>{if(worker.state==='installed'||worker.state==='activated')resolve();else if(worker.state==='redundant')reject(Error('Download non riuscito. Verifica la connessione e lo spazio disponibile.'));};worker.addEventListener('statechange',check);check();});
    }
    worker=registration.waiting;
    if(worker){
      status.textContent='Applicazione dell’aggiornamento…';
      await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Aggiornamento non completato. Chiudi le altre finestre di Plystreak e riprova.')),30000);const check=()=>{if(worker.state==='activated'){clearTimeout(timer);resolve();}else if(worker.state==='redundant'){clearTimeout(timer);reject(Error('Aggiornamento non riuscito. Riprova.'));}};worker.addEventListener('statechange',check);worker.postMessage({type:'SKIP_WAITING'});check();});
    }
    status.textContent='Aggiornamento completato. Apertura di Plystreak…';location.replace('./');
  }catch(error){status.textContent=error.message||'Aggiornamento non riuscito. Riprova.';button.disabled=false;}
};
</script></body></html>
