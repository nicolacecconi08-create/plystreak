<!doctype html><html><body><style>#board{display:none}</style><pre id="result">Running</pre><div id="board"></div><iframe title="Tablet navigation" src="dist/coach.html" style="width:820px;height:900px"></iframe><script type="module">
import {updateBoard} from './dist/board-dom.js';import {Chess} from './dist/vendor/chess.js';
const board=document.querySelector('#board'),game=new Chess();
function draw(){const html=Array.from({length:64},(_,i)=>{const sq='abcdefgh'[i%8]+(8-Math.floor(i/8)),p=game.get(sq);return `<button data-sq="${sq}" class="square">${p?`<img src="dist/pieces/${p.color}${p.type.toUpperCase()}.png">`:''}</button>`}).join('');updateBoard(board,html);if(board.children.length!==64)throw Error('square count');for(const s of board.children){const p=game.get(s.dataset.sq);if((s.querySelector('img')?.getAttribute('src')||null)!==(p?`dist/pieces/${p.color}${p.type.toUpperCase()}.png`:null))throw Error('piece mismatch '+s.dataset.sq)}}
try{draw();const king=board.querySelector('[data-sq=e1] img'),pawn=board.querySelector('[data-sq=e2] img'),square=board.querySelector('[data-sq=e1]');draw();if(square!==board.querySelector('[data-sq=e1]'))throw Error('square replaced');game.move('e4');draw();if(pawn!==board.querySelector('[data-sq=e4] img'))throw Error('moving image replaced');for(const m of ['e5','Nf3','Nc6','Bc4','Nf6','O-O','Nxe4']){game.move(m);draw()}if(king!==board.querySelector('[data-sq=g1] img'))throw Error('castled image replaced');for(let i=0;i<8;i++){game.undo();draw()}document.querySelector('#result').textContent='PASS: stable squares and piece images, normal moves, castling, capture and undo.'}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}
</script></body></html>
